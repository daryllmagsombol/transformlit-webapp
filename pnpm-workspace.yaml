packages:
  - "apps/*"
  - "packages/*"
  - "!**/test/**"

allowBuilds:
  '@apollo/protobufjs': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  cpu-features: true
  esbuild: true
  prisma: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true

overrides:
  lodash: '>=4.18.0'
  ws: '>=8.21.0'
  multer: '>=2.2.0'
  '@hono/node-server': '>=1.19.13'
  js-yaml: '>=5.3.0'
  postcss: '>=8.5.26'
  fast-uri: 3.1.5
  protobufjs: 7.6.5
  fast-xml-parser: 5.11.0
  deepmerge-ts: 8.0.1
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@5: 5.0.9
