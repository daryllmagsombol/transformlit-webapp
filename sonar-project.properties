sonar.projectKey=transformlit-webapp
sonar.projectName=TransformLit

# pnpm monorepo: analyze all app + package sources
sonar.sources=apps,packages

# Generated, vendored, and runtime content
sonar.exclusions=**/node_modules/**,**/.next/**,**/.turbo/**,**/dist/**,**/build/**,**/coverage/**,**/.git/**,**/.env*,**/*.test.*,**/*.spec.*,**/*.d.ts,**/__generated__/**,docs/**,infra/**,.github/**,images/**,uploads/**,deploy/**,apps/web/playwright-report/**

# Coverage: uncomment when you want LCOV reports uploaded
# sonar.javascript.lcov.reportPaths=apps/*/coverage/lcov.info,packages/*/coverage/lcov.info