sonar.projectKey=transformlit-webapp
sonar.projectName=TransformLit

# pnpm monorepo: analyze all app + package sources
sonar.sources=apps,packages

# Generated, vendored, and runtime content.
# The top-level patterns are anchored with a leading `/`: without it, a pattern
# such as `uploads/**` matches a directory named `uploads` at ANY depth and
# silently excludes real source (e.g. apps/api/src/uploads/*).
sonar.exclusions=**/node_modules/**,**/.next/**,**/.turbo/**,**/dist/**,**/build/**,**/coverage/**,**/.git/**,**/.env*,**/*.test.*,**/*.spec.*,**/*.d.ts,**/__generated__/**,/docs/**,/infra/**,/.github/**,/images/**,/uploads/**,/deploy/**,/apps/web/playwright-report/**,/apps/web/e2e/**

# Coverage: LCOV reports generated by each workspace's jest run in the
# SonarQube workflow (see .github/workflows/sonarqube.yml). Paths are relative
# to this file (sonar.projectBaseDir) — the workflow rewrites each report's
# `SF:` entries from package-relative to repo-relative before the scan.
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/api/coverage/lcov.info,packages/shared/coverage/lcov.info

# Files the project's own jest configs exclude from coverage, plus build
# tooling / type-only / test-infrastructure files that have no executable
# logic. Mirroring the project's declared coverage scope keeps Sonar's "lines
# to cover" denominator consistent with the coverage actually collected,
# instead of counting generated types, NestJS wiring, or tooling as uncovered.
sonar.coverage.exclusions=\
  apps/api/src/**/*.module.ts,\
  apps/api/src/**/*.model.ts,\
  apps/api/src/**/models/**,\
  apps/api/src/main.ts,\
  apps/api/src/**/index.ts,\
  apps/api/src/azure/**,\
  apps/api/src/chat/pubsub.service.ts,\
  apps/api/src/auth/strategies/google.strategy.ts,\
  apps/api/src/auth/auth.controller.ts,\
  apps/api/src/generate-schema.ts,\
  apps/api/src/common/decorators/**,\
  apps/api/src/prisma/**,\
  apps/api/src/worker/**,\
  apps/api/src/**/*.types.ts,\
  apps/api/test/**,\
  apps/api/prisma/**,\
  apps/web/src/app/**/page.tsx,\
  apps/web/src/app/**/layout.tsx,\
  apps/web/src/app/**/loading.tsx,\
  apps/web/src/app/**/not-found.tsx,\
  apps/web/src/app/**/error.tsx,\
  apps/web/src/app/*.tsx,\
  apps/web/src/app/auth-redirect.tsx,\
  apps/web/src/**/index.ts,\
  apps/web/src/lib/apollo-client.ts,\
  apps/web/src/components/providers/**,\
  apps/web/src/**/*.types.ts,\
  apps/web/src/lib/bible/types.ts,\
  apps/web/test/**,\
  apps/web/e2e/**,\
  packages/shared/src/types/**,\
  packages/shared/src/enums.ts,\
  packages/shared/src/index.ts,\
  packages/graphql/**,\
  **/*.config.ts,\
  **/jest.setup.ts,\
  **/*.types.ts
