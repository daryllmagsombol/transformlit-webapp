name: Build release image archives

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA to build
        required: true
        default: 7fefa4920a27a05ad2d603098b61d5a2eb905008
        type: string

permissions:
  contents: read

concurrency:
  group: release-image-archives-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build native amd64 images
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Validate source SHA and fetch exact commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_DIR: ${{ runner.temp }}/release-source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'source_sha must be a full lowercase 40-character SHA\n' >&2
            exit 1
          fi

          mkdir -p "$SOURCE_DIR"
          git -C "$SOURCE_DIR" init --quiet
          git -C "$SOURCE_DIR" -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)" \
            fetch --quiet --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$SOURCE_SHA"
          fetched_sha="$(git -C "$SOURCE_DIR" rev-parse FETCH_HEAD)"
          if [[ "$fetched_sha" != "$SOURCE_SHA" ]]; then
            printf 'Fetched commit %s does not match requested SHA %s\n' "$fetched_sha" "$SOURCE_SHA" >&2
            exit 1
          fi
          git -C "$SOURCE_DIR" checkout --quiet --detach "$fetched_sha"

      - name: Build API image for linux/amd64
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_DIR: ${{ runner.temp }}/release-source
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "transformlit-api:${SOURCE_SHA}" \
            --file "$SOURCE_DIR/apps/api/Dockerfile" "$SOURCE_DIR"

      - name: Build web image for linux/amd64
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_DIR: ${{ runner.temp }}/release-source
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --build-arg NEXT_PUBLIC_API_URL=/api/graphql \
            --build-arg NEXT_PUBLIC_WS_URL=/api/graphql \
            --tag "transformlit-web:${SOURCE_SHA}" \
            --file "$SOURCE_DIR/apps/web/Dockerfile" "$SOURCE_DIR"

      - name: Export archives and image metadata
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/release-images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"

          for image in api web; do
            tag="transformlit-${image}:${SOURCE_SHA}"
            docker save "$tag" | gzip -n > "$OUTPUT_DIR/transformlit-${image}-${SOURCE_SHA}-linux-amd64.tar.gz"
            docker image inspect "$tag" | jq --arg image "$tag" --arg revision "$SOURCE_SHA" \
              '.[0] | {
                image: $image,
                id: .Id,
                architecture: .Architecture,
                revision: $revision,
                sizeBytes: .Size
              }' > "$OUTPUT_DIR/transformlit-${image}-${SOURCE_SHA}-metadata.json"
          done

          (cd "$OUTPUT_DIR" && shasum -a 256 ./*.tar.gz > SHA256SUMS)

      - name: Upload image archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transformlit-images-${{ inputs.source_sha }}-linux-amd64
          path: ${{ runner.temp }}/release-images/*
          if-no-files-found: error
          retention-days: 3
