name: PR Checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The API typecheck needs the generated Prisma client. It is not committed
      # (it lands in node_modules), and `pnpm install` does not run `prisma
      # generate` — the `prepare` hook was removed in 875f469 because it broke
      # Docker builds. Generate it explicitly before typechecking.
      - name: Generate Prisma client
        run: pnpm --filter @transformlit/api run db:generate
      - run: pnpm typecheck

  review:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    outputs:
      has_bugs: ${{ steps.check.outputs.has_bugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Non-blocking by design. This action is a write-capable agent, not a
      # review-only tool: on a `pull_request` event it treats the PR as a work
      # target and, when its worktree ends up dirty, runs `git commit` +
      # `git push` to the PR branch. The job only has `contents: read`, so that
      # push cannot succeed (403), and the action never sets a git identity when
      # `use_github_token: true` (see configureGit being gated on
      # `!useGithubToken`), so the commit fails first with "Author identity
      # unknown". Its review text is still posted as a PR *comment*, which is
      # the useful output; the commit failure is not actionable here.
      # typecheck is the real blocking gate.
      - name: AI Code Review
        id: ai-review
        continue-on-error: true
        uses: anomalyco/opencode/github@v1.17.8
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true
          prompt: |
            Review this pull request.

            Read the diff and changed files. Check for:
            - Bugs and logic errors
            - Security vulnerabilities
            - Missing error handling

            Be conservative — only flag things you're 90%+ sure about.
            Skip style, formatting, and naming nits.
            If the code looks good, say LGTM.
            Write findings as a PR review with file:line references.
            Add the model's name at the end of your review for traceability.
      - name: Check if review found issues
        id: check
        if: always()
        # Non-blocking: this step only surfaces the verdict; it must not fail the
        # job. Note it polls /pulls/{n}/reviews, which this action never writes
        # (it posts an issue comment), so BODY is always empty in practice.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Poll for the review — it may take a moment to appear via GitHub API
          for i in $(seq 1 6); do
            sleep 5
            REVIEW=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
              --jq 'sort_by(.submitted_at) | last(.[])' 2>/dev/null || echo '{}')
            STATE=$(echo "$REVIEW" | jq -r '.state // "PENDING"')
            BODY=$(echo "$REVIEW" | jq -r '.body // ""')

            # Exit loop once we have a real review (not pending/empty)
            if [ "$STATE" != "PENDING" ] && [ -n "$BODY" ]; then
              break
            fi
            echo "Waiting for review to post... (attempt ${i}/6)"
          done

          echo "Review state: ${STATE}"

          if [ "$STATE" = "APPROVED" ]; then
            echo "Review approved — no bugs"
            echo "has_bugs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check for patterns that indicate actionable problems
          if echo "$BODY" | grep -qiE '\b(bug|vulnerab|exploit|bypass|incorrect|wrong|broken|memory leak|severity)\b'; then
            echo "⚠️  Review found bugs/security issues"
            echo "has_bugs=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if echo "$BODY" | grep -qiE '\b(must fix|needs (work|fix|to be)|should not merge|missing error)\b'; then
            echo "⚠️  Review flagged items needing fixes"
            echo "has_bugs=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Review posted — no definitive bugs detected"
          echo "has_bugs=false" >> "$GITHUB_OUTPUT"

  gate:
    needs: [typecheck, review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Typecheck must pass
        if: needs.typecheck.result != 'success' && needs.typecheck.result != 'skipped'
        run: |
          echo "❌ TypeScript compilation failed"
          exit 1

      # Informational only — the AI review is deliberately non-blocking (see the
      # note on the AI Code Review step). Surface its outcome, never fail on it.
      - name: Report review outcome
        if: needs.review.result == 'failure'
        run: |
          echo "::warning::AI review job did not complete — see its logs. Not blocking."

      - name: All clear
        run: echo "✅ All checks passed"